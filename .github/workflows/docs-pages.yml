name: Publish bilingual documents
on:
  push:
    branches: [main]
    paths:
      - 'docs/user-materials/**'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare public documents only
        run: |
          mkdir -p _site
          cp docs/user-materials/*.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy documents
        id: deployment
        uses: actions/deploy-pages@v4
