name: Publish bilingual documents
on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'assets/branding/app-icon.png'
      - 'docs/**/*.png'
      - 'docs/**/*.svg'
      - 'server/training_management/openapi.json'
      - 'tools/docs/**'
      - 'docs/user-materials/**'
      - 'docs/user-guide*.html'
      - '.github/workflows/docs-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: documentation-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Build bilingual document reader
        run: |
          python3 -m pip install markdown-it-py==4.2.0
          python3 tools/docs/build_docs_site.py
          python3 tools/docs/build_docs_site.py --check
          python3 tools/docs/check_docs_site.py
      - name: Check bilingual document coverage and links
        run: python3 tools/docs/check_bilingual_docs.py
      - uses: actions/configure-pages@v5
      - name: Prepare generated public document site
        run: |
          mkdir -p _site
          cp -R docs/site/. _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy documents
        id: deployment
        uses: actions/deploy-pages@v4
