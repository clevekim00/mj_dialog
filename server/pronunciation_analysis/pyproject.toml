[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-rehab-pronunciation-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "python-multipart>=0.0.9",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
ml = ["numpy>=1.26", "torch>=2.2", "transformers>=4.48"]
test = ["httpx>=0.27"]
